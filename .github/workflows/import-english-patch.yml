name: Import verified English v1.0 patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-english-patch.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reconstruct exact supplied BPS
        shell: bash
        run: |
          set -euo pipefail
          old=site/patches/jessie-james-english-v1.0-9ea90390.bps
          new=site/patches/jessie-james-english-v1.0-804c969e.bps
          echo "7ff93d0d1740605139dcc38fa08e9175bd38cb55f11c20d769655cca095d1594  $old" | sha256sum -c -
          printf '%s' '' | base64 -d > /tmp/english-transfer.zst
          echo '11ccf83a15c1b0d00b6731f650b65004f4142a8af885124a8fb040c26402b5ad  /tmp/english-transfer.zst' | sha256sum -c -
          command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd; }
          zstd -d --patch-from="$old" /tmp/english-transfer.zst -o "$new"
          echo "ffd47fb0f86f5b6034312c51fa6601dfb52e8ed8e8fd6a352aa1e4dc8a72f4be  $new" | sha256sum -c -
          test "$(git hash-object "$new")" = '0d5adae7596de176c3a6a856bd9c7afc656f2307'
          python3 - <<'PY'
          import json, hashlib, struct, zlib
          from pathlib import Path
          m=json.loads(Path('site/patches/releases.json').read_text())
          assert m['target']=='16777216:804C969E'
          e=m['patches'][0]
          p=Path('site')/e['path']
          b=p.read_bytes()
          assert b[:4]==b'BPS1' and len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256']
          s,t,c=struct.unpack('<III',b[-12:])
          assert (s,t,c)==(0x805E24CA,0x804C969E,0xE8133DAE)
          assert zlib.crc32(b[:-4])==c
          print('Exact full English patch verified')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$new"
          git diff --cached --stat
          git commit -m 'Correct English v1.0 build'
          git push origin HEAD:main
