name: Import verified full v1.0 patches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-full-patches.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and validate both patches
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd; }
          python3 - <<'PY'
          import base64, hashlib, json, struct, subprocess, zlib
          from pathlib import Path
          records=json.loads("[{\"lang\":\"English\",\"old\":\"804C969E\",\"target\":\"C3100CC9\",\"oldfile\":\"jessie-james-english-v1.0-804c969e.bps\",\"oldsha\":\"a583bfa3f36e6a5b88094fbf184efd87386442441264e6e4ccff11ffd8a20a2d\",\"oldpatchsha\":\"ffd47fb0f86f5b6034312c51fa6601dfb52e8ed8e8fd6a352aa1e4dc8a72f4be\",\"sha\":\"03318eb3be6804456a9e58a87a48c985c0db9e86a1885574f977e4c7a56a77c1\",\"changed\":856,\"full\":{\"path\":\"patches/jessie-james-english-v1.0-c3100cc9.bps\",\"crc\":\"5456B2B0\",\"bytes\":1750551,\"sha256\":\"a3203f71d18b1e94bc1c39b1db9bac03b07b4c0d09e9754c87d0eed5cba3fff5\"},\"blob\":\"1711f07e80e26cbbdf82a21e53e428479015c714\",\"transfer_sha\":\"c1d84d1f2153970002125bc72c051789ace24e4f93994fc896b68adcef875769\",\"b64\":\"\"},{\"lang\":\"Spanish\",\"old\":\"9901EE6E\",\"target\":\"4265331D\",\"oldfile\":\"jessie-james-spanish-qol-v1.0-9901ee6e.bps\",\"oldsha\":\"0bc4dcd2462ec9a3954567af97cb631a0dc03ba579f6bb53d0aefe4b4672e4da\",\"oldpatchsha\":\"198e3272991b405eadb352cc577e436b464e782e692a371570026bcf75161c65\",\"sha\":\"99be5012053dbdc728492a76fd0207a23b6ea47063d254c309505d674116131c\",\"changed\":896,\"full\":{\"path\":\"patches/jessie-james-spanish-qol-v1.0-4265331d.bps\",\"crc\":\"7ED0F544\",\"bytes\":426099,\"sha256\":\"c708136886dff38c99de3d0855fddbbaf4bd9dbb380bd10308b0e286a9e30043\"},\"blob\":\"195a33f28322ba648dc6ac8af1902dfa9924a613\",\"transfer_sha\":\"7776fa1935ad56b868bd8d333fa644a8f27698ed07ee01630d062c499abe60cc\",\"b64\":\"\"}]")
          source="16777216:805E24CA"
          for r in records:
              old=Path("site/patches")/r["oldfile"]
              new=Path("site")/r["full"]["path"]
              assert hashlib.sha256(old.read_bytes()).hexdigest()==r["oldpatchsha"]
              assert not new.exists()
              delta=base64.b64decode(r["b64"],validate=True)
              assert hashlib.sha256(delta).hexdigest()==r["transfer_sha"]
              tmp=Path("/tmp")/(r["lang"]+".zst")
              tmp.write_bytes(delta)
              subprocess.run(["zstd","-d","--patch-from="+str(old),str(tmp),"-o",str(new)],check=True)
              b=new.read_bytes()
              e=r["full"]
              assert b[:4]==b"BPS1" and len(b)==e["bytes"] and hashlib.sha256(b).hexdigest()==e["sha256"]
              assert subprocess.check_output(["git","hash-object",str(new)],text=True).strip()==r["blob"]
              s,t,c=struct.unpack("<III",b[-12:])
              assert s==0x805E24CA and t==int(r["target"],16) and c==int(e["crc"],16) and zlib.crc32(b[:-4])==c
              path=Path("site/patches")/("releases.json" if r["lang"]=="English" else "spanish-releases.json")
              m=json.loads(path.read_text())
              prev="16777216:"+r["old"]
              target="16777216:"+r["target"]
              assert m["target"]==prev and m["latest"]=="1.0" and len(m["patches"])==1
              assert m["romSha256"][prev]==r["oldsha"]
              m["target"]=target
              m["versions"]={source:m["versions"][source],target:m["versions"][prev]}
              m["romSha256"]={source:m["romSha256"][source],target:r["sha"]}
              m["patches"]=[dict(e,**{"from":source,"to":target,"version":"1.0"})]
              path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n")
              print(r["lang"],"verified exact BPS",r["target"],e["sha256"])
          p=Path("README.md")
          s=p.read_text()
          for old,new in [("output CRC32: `804C969E`","output CRC32: `C3100CC9`"),("permanece en español (CRC32 `9901EE6E`)","permanece en español (CRC32 `4265331D`)")]:
              assert s.count(old)==1
              s=s.replace(old,new)
          p.write_text(s)
          p=Path("site/patches/PUBLISHING.md")
          p.write_text(p.read_text()+"\nSame-version bug-fix and text replacement: English target C3100CC9 (856 changed ROM bytes), Spanish QoL target 4265331D (896 changed ROM bytes). No restored original bytes in either edition. Both full patches preserved byte-for-byte, applied to the exact original ROM and locally verified; GitHub import checks SHA-256, Git blob identity and all BPS CRCs. No incremental ROM patches generated. Gameplay and save compatibility remain unverified.\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/patches/jessie-james-english-v1.0-c3100cc9.bps site/patches/jessie-james-spanish-qol-v1.0-4265331d.bps site/patches/releases.json site/patches/spanish-releases.json README.md site/patches/PUBLISHING.md
          git diff --cached --stat
          git commit -m 'Update v1.0 bug fixes and dialogue'
          git push origin HEAD:main
