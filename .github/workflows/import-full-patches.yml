name: Import verified Classic Mode patches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-full-patches.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and validate both patches
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd; }
          python3 - <<'PY'
          import base64, hashlib, json, struct, subprocess, zlib
          from pathlib import Path
          records=json.loads("[{\"lang\":\"English\",\"old\":\"C3100CC9\",\"oldsha\":\"03318eb3be6804456a9e58a87a48c985c0db9e86a1885574f977e4c7a56a77c1\",\"basefile\":\"jessie-james-english-v1.0-804c969e.bps\",\"basepatchsha\":\"ffd47fb0f86f5b6034312c51fa6601dfb52e8ed8e8fd6a352aa1e4dc8a72f4be\",\"target\":\"4B94C286\",\"sha\":\"702db2e6268723140bb903a0c0d60b292ccbc6ddb09b84760903870c4ed51b11\",\"full\":{\"path\":\"patches/jessie-james-english-v1.0-4b94c286.bps\",\"crc\":\"24E38DEC\",\"bytes\":1751209,\"sha256\":\"e77f06bdeff4e7e49a0d43b42bc9eb97aa2d2f82f2b07def637e7d8ef3ae32fd\"},\"blob\":\"4f717e0817a50e8d393964409bc0d8769a0b2cc9\",\"transfer_sha\":\"0a15241dd910f682cf6429193ae4cd9fe4ebb12320676fdb12c66ce4a1fcb306\",\"b64\":\"\"},{\"lang\":\"Spanish\",\"old\":\"4265331D\",\"oldsha\":\"99be5012053dbdc728492a76fd0207a23b6ea47063d254c309505d674116131c\",\"basefile\":\"jessie-james-spanish-qol-v1.0-9901ee6e.bps\",\"basepatchsha\":\"198e3272991b405eadb352cc577e436b464e782e692a371570026bcf75161c65\",\"target\":\"8209F6BB\",\"sha\":\"4a2a0a69dcf546b1dc1ffb33add93c548e081525a949453cb50c09da9834a38c\",\"full\":{\"path\":\"patches/jessie-james-spanish-qol-v1.0-8209f6bb.bps\",\"crc\":\"87647FD1\",\"bytes\":426749,\"sha256\":\"2d00f094f60944c58bd5db6a190f0385fa6d938f40ad620011d341141fbb02a9\"},\"blob\":\"1cb5f1a8c09bb0fa3728c369ff1bc195e8c8b7e2\",\"transfer_sha\":\"3b2971b191321be2e1649a958aa0d008f5987bf1d8617c2c0aad0559200bc4ed\",\"b64\":\"\"}]")
          source="16777216:805E24CA"
          for r in records:
              old=Path("site/patches")/r["basefile"]
              new=Path("site")/r["full"]["path"]
              assert hashlib.sha256(old.read_bytes()).hexdigest()==r["basepatchsha"]
              assert not new.exists()
              delta=base64.b64decode(r["b64"],validate=True)
              assert hashlib.sha256(delta).hexdigest()==r["transfer_sha"]
              tmp=Path("/tmp")/(r["lang"]+".zst")
              tmp.write_bytes(delta)
              subprocess.run(["zstd","-d","--patch-from="+str(old),str(tmp),"-o",str(new)],check=True)
              b=new.read_bytes()
              e=r["full"]
              assert b[:4]==b"BPS1" and len(b)==e["bytes"] and hashlib.sha256(b).hexdigest()==e["sha256"]
              assert subprocess.check_output(["git","hash-object",str(new)],text=True).strip()==r["blob"]
              s,t,c=struct.unpack("<III",b[-12:])
              assert s==0x805E24CA and t==int(r["target"],16) and c==int(e["crc"],16) and zlib.crc32(b[:-4])==c
              path=Path("site/patches")/("releases.json" if r["lang"]=="English" else "spanish-releases.json")
              m=json.loads(path.read_text())
              prev="16777216:"+r["old"]
              target="16777216:"+r["target"]
              assert m["target"]==prev and m["latest"]=="1.0" and len(m["patches"])==1
              assert m["romSha256"][prev]==r["oldsha"]
              m["target"]=target
              m["versions"]={source:m["versions"][source],target:m["versions"][prev]}
              m["romSha256"]={source:m["romSha256"][source],target:r["sha"]}
              m["patches"]=[dict(e,**{"from":source,"to":target,"version":"1.0"})]
              path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n")
              print(r["lang"],"verified exact BPS",r["target"],e["sha256"])
          p=Path("README.md")
          s=p.read_text()
          for old,new in [("output CRC32: `C3100CC9`","output CRC32: `4B94C286`"),("permanece en español (CRC32 `4265331D`)","permanece en español (CRC32 `8209F6BB`)")]:
              assert s.count(old)==1
              s=s.replace(old,new)
          p.write_text(s)
          p=Path("site/patches/PUBLISHING.md")
          p.write_text(p.read_text()+"\nSame-version Classic Mode fix: English target 4B94C286, Spanish QoL target 8209F6BB. The supplied English attachment was a complete ROM; a full BPS was generated against the exact original Spanish FINAL v1.1 ROM and independently applied to reproduce the supplied ROM byte-for-byte. The supplied Spanish full BPS was preserved exactly and applied to the same original ROM. GitHub import validates SHA-256, Git blob identity and BPS CRCs. No ROM files, save files, or incremental ROM patches published. Classic Mode behavior and save compatibility remain unverified.\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/patches/jessie-james-english-v1.0-4b94c286.bps site/patches/jessie-james-spanish-qol-v1.0-8209f6bb.bps site/patches/releases.json site/patches/spanish-releases.json README.md site/patches/PUBLISHING.md
          git diff --cached --stat
          git commit -m 'Fix Classic Mode in v1.0'
          git push origin HEAD:main
