name: Import verified full v1.0 patches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-full-patches.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and validate both patches
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd; }
          python3 - <<'PY'
          import base64, hashlib, json, struct, subprocess, zlib
          from pathlib import Path
          records=json.loads("[{\"lang\":\"English\",\"old\":\"4B94C286\",\"oldsha\":\"702db2e6268723140bb903a0c0d60b292ccbc6ddb09b84760903870c4ed51b11\",\"basefile\":\"jessie-james-english-v1.0-804c969e.bps\",\"basepatchsha\":\"ffd47fb0f86f5b6034312c51fa6601dfb52e8ed8e8fd6a352aa1e4dc8a72f4be\",\"target\":\"C043455C\",\"sha\":\"a69cd2306ae494d4db0e16772d007438d425dd43cd5287757a5e04035551da4a\",\"full\":{\"path\":\"patches/jessie-james-english-v1.0-c043455c.bps\",\"crc\":\"2C5B132F\",\"bytes\":1751571,\"sha256\":\"1efc4ef63c2da89d0f4c7b22ec8c8db9cf81d1a1514f489f6fa20c60d761fad9\"},\"blob\":\"a21e56afe06a12099b77aabfdcb00f5a19cb52df\",\"transfer_sha\":\"69b4b214dc88b396013293963b05cef8970a25e2f319d4effab0db2e409fb3f0\",\"b64\":\"\"},{\"lang\":\"Spanish\",\"old\":\"8209F6BB\",\"oldsha\":\"4a2a0a69dcf546b1dc1ffb33add93c548e081525a949453cb50c09da9834a38c\",\"basefile\":\"jessie-james-spanish-qol-v1.0-9901ee6e.bps\",\"basepatchsha\":\"198e3272991b405eadb352cc577e436b464e782e692a371570026bcf75161c65\",\"target\":\"7C042814\",\"sha\":\"7a9587b11af0385a589b9b7ad309edea1f3dac58705da2a3cd8ae84164e41a18\",\"full\":{\"path\":\"patches/jessie-james-spanish-qol-v1.0-7c042814.bps\",\"crc\":\"C98CD5EB\",\"bytes\":427112,\"sha256\":\"adb19917976b3ce193eaede82f66fd66db53378007793dcaf1b6fd2a285f07f7\"},\"blob\":\"283e7168b38639668a628601b915b9aac7f7f22d\",\"transfer_sha\":\"de25917f7f813b9241ef0e51170e66ad9ca2c41542943c316990aa05343591ab\",\"b64\":\"\"}]")
          source="16777216:805E24CA"
          for r in records:
              old=Path("site/patches")/r["basefile"]
              new=Path("site")/r["full"]["path"]
              assert hashlib.sha256(old.read_bytes()).hexdigest()==r["basepatchsha"]
              assert not new.exists()
              delta=base64.b64decode(r["b64"],validate=True)
              assert hashlib.sha256(delta).hexdigest()==r["transfer_sha"]
              tmp=Path("/tmp")/(r["lang"]+".zst")
              tmp.write_bytes(delta)
              subprocess.run(["zstd","-d","--patch-from="+str(old),str(tmp),"-o",str(new)],check=True)
              b=new.read_bytes()
              e=r["full"]
              assert b[:4]==b"BPS1" and len(b)==e["bytes"] and hashlib.sha256(b).hexdigest()==e["sha256"]
              assert subprocess.check_output(["git","hash-object",str(new)],text=True).strip()==r["blob"]
              s,t,c=struct.unpack("<III",b[-12:])
              assert s==0x805E24CA and t==int(r["target"],16) and c==int(e["crc"],16) and zlib.crc32(b[:-4])==c
              path=Path("site/patches")/("releases.json" if r["lang"]=="English" else "spanish-releases.json")
              m=json.loads(path.read_text())
              prev="16777216:"+r["old"]
              target="16777216:"+r["target"]
              assert m["target"]==prev and m["latest"]=="1.0" and len(m["patches"])==1
              assert m["romSha256"][prev]==r["oldsha"]
              m["target"]=target
              m["versions"]={source:m["versions"][source],target:m["versions"][prev]}
              m["romSha256"]={source:m["romSha256"][source],target:r["sha"]}
              m["patches"]=[dict(e,**{"from":source,"to":target,"version":"1.0"})]
              path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n")
              print(r["lang"],"verified exact BPS",r["target"],e["sha256"])
          for path in ["README.md","site/index.html"]:
              p=Path(path)
              s=p.read_text()
              for old,new in [("I've reworked trainer teams and improved the battle AI for those who want a bit more of a challenge, without increasing levels or placing restrictions on the player.","I've written custom scripts to improve trainer AI, increased team depth and added more variety to movesets, without increasing levels or placing restrictions on the player."),("He modificado los equipos de los entrenadores y mejorado la IA de combate para quienes busquen un poco más de dificultad, sin subir los niveles ni imponer restricciones al jugador.","He escrito scripts propios para mejorar la IA de los entrenadores, he ampliado sus equipos y he dado más variedad a sus movimientos, sin subir los niveles ni imponer restricciones al jugador.")]:
                  assert s.count(old)==1
                  s=s.replace(old,new)
              if path=="README.md":
                  for old,new in [("output CRC32: `4B94C286`","output CRC32: `C043455C`"),("permanece en español (CRC32 `8209F6BB`)","permanece en español (CRC32 `7C042814`)")]:
                      assert s.count(old)==1
                      s=s.replace(old,new)
              p.write_text(s)
          p=Path("site/patches/PUBLISHING.md")
          p.write_text(p.read_text()+"\nSame-version full-patch replacement: English C043455C, Spanish QoL 7C042814. Both full BPS attachments preserved byte-for-byte, applied locally against the exact original Spanish FINAL v1.1 ROM, and GitHub import verifies SHA-256, Git blob identity and BPS CRCs. Updated the English and Spanish Hard Mode descriptions to mention custom scripts, team depth and moveset variety. No incremental patches, ROM files or saves published. Gameplay and save compatibility remain unverified.\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/patches/jessie-james-english-v1.0-c043455c.bps site/patches/jessie-james-spanish-qol-v1.0-7c042814.bps site/patches/releases.json site/patches/spanish-releases.json README.md site/index.html site/patches/PUBLISHING.md
          git diff --cached --stat
          git commit -m 'Update v1.0 patches and Hard Mode description'
          git push origin HEAD:main
