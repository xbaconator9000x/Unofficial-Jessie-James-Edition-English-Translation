name: Import verified gallery archive
on:
  push:
    branches: ['gallery/new-gameplay-captures-20261120']
    paths:
      - 'jessie-james-gallery-assets.zip'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract supplied images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          p=Path('jessie-james-gallery-assets.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='9cdf2c7d03f11fc95e863aaa596f4852e2aed2e517c85b74b074d780be27ba30'
          expected=json.loads("{\"english-dialogue.gif\":[414657,\"01c857e7bc7063fd63f763d24809f19cc8f91294d12063317a20822eadba309a\"],\"english-rocket-base.gif\":[785968,\"dcb6dbe03c2b22e2c4209babac93b95c7c20ea1f6501790a55db9289f517260a\"],\"english-exp-all.png\":[271680,\"6d7c2424603dc9ef3661b4e5ea968b08fe3a42a32eaa2e7f9a430eaf1f17d38b\"],\"english-train-dialogue.gif\":[899001,\"bafcc6a786bff94913b6c01947d9c566b6989bab273a00c061bebc6e4d1e94d5\"],\"english-battle-qol.gif\":[48362,\"4e43ccec4eed9964ed9cd0a757c78f1e7dddd8379c9f46024aecd08b5cb1a0ab\"],\"english-team-rocket-motto.gif\":[2429948,\"8454a1cbdebd8b64dd2d080c141fdd48a3d7be9425affa3c688b4a587a45382b\"],\"english-hard-mode.gif\":[82769,\"1cadfa82a452b9ccda0913dcc8fb45ccf6440caed771d085bdb3a4e88604971f\"],\"english-save-mode.png\":[179939,\"066f1e23697b2d5e5d6552af91b866370f5a7dcc0907e10322ab26f8e5344a0b\"],\"english-battle-mode.gif\":[15357,\"4979547e4b0352fc3f6efaadfaabb68b6e3e30de5f176632ba18a8f2b529fe95\"]}")
          with zipfile.ZipFile(p) as z:
              assert len(z.namelist())==len(expected) and set(z.namelist())==set(expected)
              for name,(size,sha) in expected.items():
                  data=z.read(name)
                  assert len(data)==size and hashlib.sha256(data).hexdigest()==sha
                  assert data.startswith(b'GIF8') if name.endswith('.gif') else data.startswith(b'\x89PNG\r\n\x1a\n')
                  (Path('site')/name).write_bytes(data)
                  print('VERIFIED:',name)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/english-dialogue.gif site/english-rocket-base.gif site/english-exp-all.png site/english-train-dialogue.gif site/english-battle-qol.gif site/english-team-rocket-motto.gif site/english-hard-mode.gif site/english-save-mode.png site/english-battle-mode.gif
          git rm -- jessie-james-gallery-assets.zip .github/workflows/import-gallery.yml
          git commit -m 'Add verified English gameplay captures'
          git push origin HEAD:gallery/new-gameplay-captures-20261120
