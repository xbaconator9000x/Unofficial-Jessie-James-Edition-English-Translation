name: Import verified English v1.01
on:
  push:
    branches: ['release/v1.01-20261120']
    paths:
      - '.github/workflows/import-v101.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and prepare release
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd || { sudo apt-get update && sudo apt-get install -y zstd; }
          python3 - <<'PY'
          import base64, hashlib, json, struct, subprocess, zlib
          from pathlib import Path
          base=Path("site/patches/jessie-james-english-v1.0-804c969e.bps")
          assert hashlib.sha256(base.read_bytes()).hexdigest()=="ffd47fb0f86f5b6034312c51fa6601dfb52e8ed8e8fd6a352aa1e4dc8a72f4be"
          delta=base64.b64decode("",validate=True)
          assert len(delta)==4670 and hashlib.sha256(delta).hexdigest()=="9a3c68747c17f60a83ffe234b0e45709e8b0f7bdc264b890db6ecc033a724ecf"
          Path("/tmp/v101.zst").write_bytes(delta)
          path=Path("site/patches/jessie-james-english-v1.01-a3e3cc2f.bps")
          assert not path.exists()
          subprocess.run(["zstd","-d","--patch-from="+str(base),"/tmp/v101.zst","-o",str(path)],check=True)
          b=path.read_bytes()
          assert b[:4]==b"BPS1" and len(b)==1751815 and hashlib.sha256(b).hexdigest()=="634a9867c57707e1951b54b5f33b0975452c649d099185915713625f6ef08ba7"
          assert subprocess.check_output(["git","hash-object",str(path)],text=True).strip()=="aaf31971e7546bafca06654c4a057227ef43e94a"
          assert struct.unpack("<III",b[-12:])==(0x805E24CA,0xA3E3CC2F,0x86519001)
          assert zlib.crc32(b[:-4])==0x86519001
          print("Verified exact full English v1.01 BPS")
          manifest=Path("site/patches/releases.json")
          m=json.loads(manifest.read_text())
          source="16777216:805E24CA"
          prev="16777216:C043455C"
          target="16777216:A3E3CC2F"
          assert m["latest"]=="1.0" and m["target"]==prev and len(m["patches"])==1
          assert m["romSha256"][prev]=="a69cd2306ae494d4db0e16772d007438d425dd43cd5287757a5e04035551da4a"
          m["latest"]="1.01"
          m["target"]=target
          m["versions"]={source:m["versions"][source],target:"English v1.01"}
          m["romSha256"]={source:m["romSha256"][source],target:"06d9c87234400f45f1fc3a356881f0ad8bd9b977bc5cbed450e5c7eedd01b632"}
          m["patches"]=[{"path":"patches/"+path.name,"crc":"86519001","bytes":len(b),"sha256":hashlib.sha256(b).hexdigest(),"from":source,"to":target,"version":"1.01"}]
          assert len(m["changelog"])==1 and m["changelog"][0]["version"]=="1.0"
          m["changelog"][0]["date"]="20 November 2026"
          notes=["Fixed graphical issue during blast-off sequence","Corrected byte allocation overlap for EXP. ALL and Hard mode","Corrected game-breaking freeze in Oak's lab."]
          m["changelog"].insert(0,{"version":"1.01","date":"20 November 2026","changes":notes})
          manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n")
          def replace(file,old,new):
              p=Path(file)
              s=p.read_text()
              assert s.count(old)==1,(file,old)
              p.write_text(s.replace(old,new))
          replace("README.md","**English v1.0** -- 17 November 2026.","**English v1.01** -- 20 November 2026.")
          replace("README.md","Expected English v1.0 output CRC32: `C043455C`. Keep backups of your ROM and save. Future releases will include verified update paths from earlier versions. No pre-patched ROMs.","Expected English v1.01 output CRC32: `A3E3CC2F`. Apply the full patch to the original Spanish FINAL v1.1 ROM, including when updating from v1.0. Keep backups of your ROM and save. No pre-patched ROMs.")
          replace("README.md","### English v1.0 -- 17 November 2026","### English v1.01 -- 20 November 2026\n\n"+"\n".join("- "+n for n in notes)+"\n\n### English v1.0 -- 20 November 2026")
          replace("site/index.html",'id="latest-version">1.0</span>','id="latest-version">1.01</span>')
          replace("site/patches/PUBLISHING.md","| English | 1.0 | C043455C | jessie-james-english-v1.0-c043455c.bps |","| English | 1.01 | A3E3CC2F | jessie-james-english-v1.01-a3e3cc2f.bps |")
          replace("site/patches/PUBLISHING.md","- For a new numbered release, update the version and changelog, and provide verified incremental update paths from supported earlier releases.\n- For a same-version correction to v1.0, retain the version and original release date. The current manifests accept the original ROM and recognise the latest patched output. Earlier v1.0 builds require reapplying the full patch to the original ROM.","- For a new numbered release, update the version and changelog. For a same-version correction, retain the version and original release date.\n- The current manifests accept the original ROM and recognise the latest patched output. Earlier builds require reapplying the full patch to the original ROM.")
          replace(".github/workflows/pages.yml","          assert hashlib.sha256(canonical.read_bytes()).hexdigest() == current['sha256']","          assert hashlib.sha256(canonical.read_bytes()).hexdigest() == current['sha256']\n          canonical_current = site / ('patches/jessie-james-english-v' + english['latest'] + '.bps')\n          if site / current['path'] != canonical_current:\n              copyfile(site / current['path'], canonical_current)\n          assert hashlib.sha256(canonical_current.read_bytes()).hexdigest() == current['sha256']")
          PY
          node tests/bps.test.mjs
          node tests/edition-routes.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-v101.yml
          git add site/patches/jessie-james-english-v1.01-a3e3cc2f.bps site/patches/releases.json README.md site/index.html site/patches/PUBLISHING.md .github/workflows/pages.yml
          git diff --cached --stat
          git commit -m 'Release English v1.01'
          git push origin HEAD:release/v1.01-20261120
