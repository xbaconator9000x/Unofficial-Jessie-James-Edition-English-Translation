name: Publish Team Rocket landing page

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'site/**'
      - 'downloads/**'
      - '.github/workflows/pages.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: 'jessie-james-pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble verified historical patches and stage v1.04 BPS files without ROM data
        run: python3 site/patches/assemble_release.py
      - name: Verify v1.03 release candidate against existing BPS patch chain
        run: python3 tests/release-v103-candidate.py
      - name: Verify v1.04 repository downloads
        run: python3 tests/release-v104.test.py
      - name: Package approved fan artwork
        run: python3 site/media/build_art_pack.py
      - name: Check static site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path('site')
          html = (site / 'index.html').read_text(encoding='utf-8')
          assert all(value in html for value in ('id="story"', 'id="screenshots"', 'https://tally.so/r/M1N2oE'))
          assert not list(site.rglob('*.gba')) and not list(site.rglob('*.sav'))
          print('PASS: static landing page and content checks')
          PY
      - name: Check title audio and player
        shell: bash
        run: |
          set -euo pipefail
          node --check site/player.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('site')
          audio = (root/'title-motto-loop.mp3').read_bytes()
          assert len(audio) == 305938, len(audio)
          assert hashlib.sha256(audio).hexdigest() == '555d43fdb42bea8874439b08a323b792f5a9d64f6abfc3f4f4248735386bf514'
          html = (root/'index.html').read_text()
          css = (root/'styles.css').read_text()
          script = (root/'player.js').read_text()
          assert 'Spanish Screenshots' in html and 'English Screenshots' in html
          assert 'fonts.googleapis.com' in html
          assert 'Pixelify Sans' in css and 'Silkscreen' in css
          assert 'music-status' not in html
          assert 'music-status' not in script
          assert 'source.loopStart = INTRO_END' in script and 'source.loopEnd = LOOP_END' in script
          assert '--r-icon' in css
          assert 'autoplay' not in html
          print('PASS: audio checksum, loop control, original screenshot labels, classic font and Rocket markers')
          PY
      - name: Test ROM patcher and verify published patch files
        run: |
          node --check site/bps.mjs
          node --check site/patcher.mjs
          node --check site/spanish-patcher.mjs
          node tests/edition-routes.test.mjs
          node tests/site-readme-parity.test.mjs
          node tests/bps.test.mjs
          python3 - <<'PY'
          import hashlib, json, struct, zlib
          from pathlib import Path
          site = Path('site')
          english = json.loads((site/'patches/releases.json').read_text())
          spanish = json.loads((site/'patches/spanish-releases.json').read_text())
          assert set(english['versions']) & set(spanish['versions']) == {'16777216:805E24CA'}
          official = json.loads((site/'patches/official-releases.json').read_text())
          assert not set(official['versions']) & (set(english['versions']) | set(spanish['versions']))
          for m in (english, spanish, official):
              assert m['target'] in m['versions']
              for key in m['versions']:
                  assert key in m['romSha256'] and len(m['romSha256'][key]) == 64
              # Every supported ROM must have an update path to the current build.
              reachable = {m['target']}
              while True:
                  expanded = reachable | {e['from'] for e in m['patches'] if e['to'] in reachable}
                  if expanded == reachable:
                      break
                  reachable = expanded
              assert set(m['versions']) <= reachable
              for edge in m['patches']:
                  assert edge['from'] in m['versions'] and edge['to'] in m['versions']
                  p = site / edge['path']
                  assert p.is_file(), f'Missing required patch: {edge["path"]}'
                  b = p.read_bytes()
                  assert len(b) == edge['bytes'] and b[:4] == b'BPS1'
                  assert hashlib.sha256(b).hexdigest() == edge['sha256']
                  sc, tc, pc = struct.unpack('<III', b[-12:])
                  assert f'{sc:08X}' == edge['from'].split(':')[1]
                  assert f'{tc:08X}' == edge['to'].split(':')[1]
                  calculated = zlib.crc32(b[:-4])
                  assert f'{calculated:08X}' == edge['crc']
                  assert pc in (0, calculated), 'BPS stored checksum is neither current nor legacy zero'
                  print('VERIFIED:', edge['path'])
          # Verify the published English gallery assets.
          asset = (site/'english-featured-gameplay.gif').read_bytes()
          assert len(asset) == 2084378 and hashlib.sha256(asset).hexdigest() == 'a1529536cf7d5331fa6822423ede6ea5750031e69d35158384bc23ab570d6d30'
          print('VERIFIED: english-featured-gameplay.gif')
          asset = (site/'english-dialogue.gif').read_bytes()
          assert len(asset) == 414657 and hashlib.sha256(asset).hexdigest() == '01c857e7bc7063fd63f763d24809f19cc8f91294d12063317a20822eadba309a'
          print('VERIFIED: english-dialogue.gif')
          asset = (site/'english-rocket-base.gif').read_bytes()
          assert len(asset) == 785968 and hashlib.sha256(asset).hexdigest() == 'dcb6dbe03c2b22e2c4209babac93b95c7c20ea1f6501790a55db9289f517260a'
          print('VERIFIED: english-rocket-base.gif')
          asset = (site/'english-exp-all.png').read_bytes()
          assert len(asset) == 271680 and hashlib.sha256(asset).hexdigest() == '6d7c2424603dc9ef3661b4e5ea968b08fe3a42a32eaa2e7f9a430eaf1f17d38b'
          print('VERIFIED: english-exp-all.png')
          asset = (site/'english-train-dialogue.gif').read_bytes()
          assert len(asset) == 899001 and hashlib.sha256(asset).hexdigest() == 'bafcc6a786bff94913b6c01947d9c566b6989bab273a00c061bebc6e4d1e94d5'
          print('VERIFIED: english-train-dialogue.gif')
          asset = (site/'english-battle-qol.gif').read_bytes()
          assert len(asset) == 48362 and hashlib.sha256(asset).hexdigest() == '4e43ccec4eed9964ed9cd0a757c78f1e7dddd8379c9f46024aecd08b5cb1a0ab'
          print('VERIFIED: english-battle-qol.gif')
          asset = (site/'english-team-rocket-motto.gif').read_bytes()
          assert len(asset) == 2429948 and hashlib.sha256(asset).hexdigest() == '8454a1cbdebd8b64dd2d080c141fdd48a3d7be9425affa3c688b4a587a45382b'
          print('VERIFIED: english-team-rocket-motto.gif')
          asset = (site/'english-hard-mode.gif').read_bytes()
          assert len(asset) == 82769 and hashlib.sha256(asset).hexdigest() == '1cadfa82a452b9ccda0913dcc8fb45ccf6440caed771d085bdb3a4e88604971f'
          print('VERIFIED: english-hard-mode.gif')
          asset = (site/'english-save-mode.png').read_bytes()
          assert len(asset) == 179939 and hashlib.sha256(asset).hexdigest() == '066f1e23697b2d5e5d6552af91b866370f5a7dcc0907e10322ab26f8e5344a0b'
          print('VERIFIED: english-save-mode.png')
          asset = (site/'english-battle-mode.gif').read_bytes()
          assert len(asset) == 15357 and hashlib.sha256(asset).hexdigest() == '4979547e4b0352fc3f6efaadfaabb68b6e3e30de5f176632ba18a8f2b529fe95'
          print('VERIFIED: english-battle-mode.gif')
          asset = (site/'pokerail-english-map.jpg').read_bytes()
          assert len(asset) == 128811 and hashlib.sha256(asset).hexdigest() == '266f1ec49ce6cab0ceba8d095d20e6511e3672b2f50ef3f7bf4ed5b9842dc307'
          print('VERIFIED: pokerail-english-map.jpg')
          asset = (site/'english-battle-qol-2.gif').read_bytes()
          assert len(asset) == 59442 and hashlib.sha256(asset).hexdigest() == '585ec554660007a01b40fe1c43496a2375ccb7c8a8be75b5bb93a562297df5cd'
          print('VERIFIED: english-battle-qol-2.gif')
          # Stable legacy URL always serves the verified current complete English BPS.
          from shutil import copyfile
          current = next(e for e in english['patches'] if e['from'] == '16777216:805E24CA' and e['to'] == english['target'])
          canonical = site / 'patches/jessie-james-english-v1.0.bps'
          if site / current['path'] != canonical:
              copyfile(site / current['path'], canonical)
          assert hashlib.sha256(canonical.read_bytes()).hexdigest() == current['sha256']
          canonical_current = site / ('patches/jessie-james-english-v' + english['latest'] + '.bps')
          if site / current['path'] != canonical_current:
              copyfile(site / current['path'], canonical_current)
          assert hashlib.sha256(canonical_current.read_bytes()).hexdigest() == current['sha256']
          current_es = next(e for e in spanish['patches'] if e['from'] == '16777216:805E24CA' and e['to'] == spanish['target'])
          canonical_es = site / 'patches/jessie-james-spanish-qol-v1.0.bps'
          if site / current_es['path'] != canonical_es:
              copyfile(site / current_es['path'], canonical_es)
          assert hashlib.sha256(canonical_es.read_bytes()).hexdigest() == current_es['sha256']
          PY
      - name: Test optional privacy-friendly website analytics
        run: python3 tests/website-analytics.test.py
      - name: Configure website traffic analytics for deployed pages (opt-in)
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: python3 scripts/inject_web_analytics.py site/index.html
      - name: Test patcher conversion analytics (privacy-safe, optional)
        run: |
          node --check site/patch-events.mjs
          node tests/patch-events.test.mjs
          python3 tests/patch-events-injection.test.py
      - name: Configure patcher conversion counts for deployed pages (optional)
        env:
          GOATCOUNTER_SITE_CODE: ${{ vars.GOATCOUNTER_SITE_CODE || 'xbaconator9000x' }}
        run: python3 scripts/inject_patch_events.py site/index.html
      - name: Build verified secondary launcher
        run: python3 site/build_secondary_launcher.py
      - name: Remove downloadable patches from public website artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path("site")
          html = (site / "index.html").read_text(encoding="utf-8")
          if 'data-downloads-suspended="true"' not in html:
              raise SystemExit("Expected suspension flag; refusing to publish downloadable patches.")
          removed = []
          for path in (site / "patches").iterdir():
              if path.suffix in (".bps", ".hex") or path.name.endswith(".xz.b64"):
                  path.unlink()
                  removed.append(path.name)
          assert removed, "Expected downloadable BPS files to be removed"
          assert not list((site / "patches").rglob("*.bps"))
          assert not list((site / "patches").rglob("*.xz.b64"))
          assert not list((site / "patches").rglob("*.hex"))
          assert (site / "launcher.html").is_file()
          assert len(list((site / "launcher-patches").glob("*.bps"))) >= 19
          print(f"Suspended {len(removed)} patch files from GitHub Pages")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for uploaded website artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" --method GET --jq '[.artifacts[] | select(.expired == false)] | length' 2>/dev/null || echo 0)
            if [[ "$count" == "1" ]]; then
              echo "Website artifact is visible."
              sleep 5
              exit 0
            fi
            echo "Waiting for website artifact ($attempt/12)."
            sleep 5
          done
          echo "::error::Website artifact did not become available."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
