name: Publish Team Rocket landing page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'jessie-james-pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check static site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path('site')
          html = (site / 'index.html').read_text(encoding='utf-8')
          assert all(value in html for value in ('id="story"', 'id="screenshots"', 'https://tally.so/r/M1N2oE'))
          assert not list(site.rglob('*.gba')) and not list(site.rglob('*.sav'))
          print('PASS: static landing page and content checks')
          PY
      - name: Check title audio and player
        shell: bash
        run: |
          set -euo pipefail
          node --check site/player.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('site')
          audio = (root/'title-motto-loop.mp3').read_bytes()
          assert len(audio) == 305938, len(audio)
          assert hashlib.sha256(audio).hexdigest() == '555d43fdb42bea8874439b08a323b792f5a9d64f6abfc3f4f4248735386bf514'
          html = (root/'index.html').read_text()
          css = (root/'styles.css').read_text()
          script = (root/'player.js').read_text()
          assert 'Original Spanish screenshots' in html
          assert 'fonts.googleapis.com' in html
          assert 'Pixelify Sans' in css and 'Silkscreen' in css
          assert 'music-status' not in html
          assert 'music-status' not in script
          assert 'source.loopStart = INTRO_END' in script and 'source.loopEnd = LOOP_END' in script
          assert '--r-icon' in css
          assert 'autoplay' not in html
          print('PASS: audio checksum, loop control, original screenshot labels, classic font and Rocket markers')
          PY
      - name: Test ROM patcher and verify published patch files
        run: |
          node --check site/bps.mjs
          node --check site/patcher.mjs
          node --check site/spanish-patcher.mjs
          node tests/edition-routes.test.mjs
          node tests/bps.test.mjs
          python3 - <<'PY'
          import hashlib, json, struct, zlib
          from pathlib import Path
          site = Path('site')
          english = json.loads((site/'patches/releases.json').read_text())
          spanish = json.loads((site/'patches/spanish-releases.json').read_text())
          assert set(english['versions']) & set(spanish['versions']) == {'16777216:805E24CA'}
          for m in (english, spanish):
              assert m['target'] in m['versions']
              for key in m['versions']:
                  assert key in m['romSha256'] and len(m['romSha256'][key]) == 64
              # Every supported ROM must have an update path to the current build.
              reachable = {m['target']}
              while True:
                  expanded = reachable | {e['from'] for e in m['patches'] if e['to'] in reachable}
                  if expanded == reachable:
                      break
                  reachable = expanded
              assert set(m['versions']) <= reachable
              for edge in m['patches']:
                  assert edge['from'] in m['versions'] and edge['to'] in m['versions']
                  p = site / edge['path']
                  assert p.is_file(), f'Missing required patch: {edge["path"]}'
                  b = p.read_bytes()
                  assert len(b) == edge['bytes'] and b[:4] == b'BPS1'
                  assert hashlib.sha256(b).hexdigest() == edge['sha256']
                  sc, tc, pc = struct.unpack('<III', b[-12:])
                  assert f'{sc:08X}' == edge['from'].split(':')[1]
                  assert f'{tc:08X}' == edge['to'].split(':')[1]
                  assert f'{pc:08X}' == edge['crc'] and zlib.crc32(b[:-4]) == pc
                  print('VERIFIED:', edge['path'])
          # Stable legacy URL always serves the verified current complete English BPS.
          from shutil import copyfile
          current = next(e for e in english['patches'] if e['from'] == '16777216:805E24CA' and e['to'] == english['target'])
          canonical = site / 'patches/jessie-james-english-v1.0.bps'
          if site / current['path'] != canonical:
              copyfile(site / current['path'], canonical)
          assert hashlib.sha256(canonical.read_bytes()).hexdigest() == current['sha256']
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
