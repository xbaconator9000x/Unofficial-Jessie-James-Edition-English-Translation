name: Publish Team Rocket landing page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'jessie-james-pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check static site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path('site')
          html = (site / 'index.html').read_text(encoding='utf-8')
          assert all(value in html for value in ('id="story"', 'id="screenshots"', 'https://tally.so/r/M1N2oE'))
          assert not list(site.rglob('*.gba')) and not list(site.rglob('*.sav'))
          print('PASS: static landing page and content checks')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
