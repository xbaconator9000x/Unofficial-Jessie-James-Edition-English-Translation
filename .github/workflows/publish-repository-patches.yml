name: Verify repository BPS downloads

on:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
      - 'site/patches/**'
      - 'tests/release-v104.test.py'
      - '.github/workflows/publish-repository-patches.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete and incremental v1.04 BPS downloads
        run: python3 tests/release-v104.test.py
